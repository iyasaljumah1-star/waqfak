# Waqfak — single-server production stack: PostgreSQL + migrations + app + scheduled jobs + backups + Caddy (automatic HTTPS).
# Usage: see RUNBOOK.md  (cp .env.example .env → fill → docker compose up -d --build)
name: waqfak

x-app-env: &app-env
  env_file: .env
  environment:
    NODE_ENV: production
    DATABASE_URL: postgres://waqfak_app:${APP_DB_PASSWORD}@db:5432/waqfak
    DATABASE_OWNER_URL: postgres://waqfak_owner:${OWNER_DB_PASSWORD}@db:5432/waqfak
    APP_URL: https://${DOMAIN}
    STORAGE_DIR: /data/storage

services:
  db:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      TZ: Asia/Riyadh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d waqfak"]  # TCP: not ready during first-run init
      interval: 5s
      retries: 20
    networks: [internal]

  migrate:
    build: { context: ., target: tools }
    image: waqfak-tools
    <<: *app-env
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    networks: [internal]

  app:
    build: { context: ., target: runner }
    image: waqfak-app
    <<: *app-env
    restart: unless-stopped
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal, web]

  jobs:
    build: { context: ., target: tools }
    image: waqfak-tools
    <<: *app-env
    restart: unless-stopped
    # Daily compliance job (statuses, reminders, document expiry, retention) at ~02:15 Riyadh time.
    command: ["sh", "-c", "while true; do now=$$(date -u +%s); next=$$(( (now/86400)*86400 + 83700 )); [ $$next -le $$now ] && next=$$((next+86400)); sleep $$((next-now)); npx tsx --conditions=react-server scripts/jobs/daily.ts || true; done"]
    volumes:
      - storage:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [internal]

  backup:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: Asia/Riyadh
    volumes:
      - ./backups:/backups
      - storage:/data/storage:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["sh", "-c", "while true; do sh /backup.sh || echo 'backup failed'; sleep 86400; done"]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:

networks:
  internal: { internal: true }
  web:
